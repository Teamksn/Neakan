<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>អានប្រលោមលោក - 剑来 (Sword of Coming)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f7f4ed;
      font-family: 'Battambang', sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 800px;
      min-height: 100vh;
      background-color: #f7f4ed;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-header {
      position: sticky;
      top: 0; left: 0; width: 100%; height: 50px;
      background-color: #f7f4ed;
      border-bottom: 1.5px solid #28a745;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 100;
    }
    .header-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: #28a745;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
      text-decoration: none;
    }
    .header-title {
      font-size: 15px;
      color: #28a745;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
      text-align: center;
    }
    .action-icons-bar {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      padding: 12px 18px 5px 18px;
    }
    .icon-action-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .content-canvas {
      flex: 1;
      padding: 10px 18px 40px 18px;
    }
    .volume-header {
      font-size: 18px;
      font-weight: 900;
      color: #111;
      text-align: center;
      margin-bottom: 5px;
    }
    .chapter-main-title {
      font-size: 17px;
      font-weight: 700;
      color: #28a745;
      text-align: center;
      margin-bottom: 25px;
    }
    .novel-text p {
      font-size: 18px;
      line-height: 2.1;
      color: #1a1a1a;
      margin-bottom: 20px;
      text-align: justify;
      word-break: break-word;
    }
    .bottom-pagination {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 20px 18px 60px 18px;
      border-top: 1px solid #e2ddd2;
    }
    .page-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #d5cec0;
      background-color: #eee9dc;
      border-radius: 4px;
      font-family: 'Battambang';
      font-size: 14px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
    }
    .toc-drawer {
      position: fixed;
      top: 0; left: -320px;
      width: 300px; height: 100%;
      background-color: #f7f4ed;
      box-shadow: 4px 0 15px rgba(0,0,0,0.2);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 20px 15px;
      transition: left 0.3s ease;
    }
    .toc-drawer.open { left: 0; }
    .toc-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
    .toc-overlay.active { display: block; }
    .drawer-novel-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
      color: #111;
    }
    .toc-search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: 'Battambang';
      margin-bottom: 12px;
      outline: none;
    }
    .toc-items-container {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .toc-items-container li {
      padding: 10px;
      font-size: 13.5px;
      border-bottom: 1px solid #eee7d7;
      cursor: pointer;
      color: #333;
    }
    .toc-items-container li.active {
      color: #28a745;
      font-weight: bold;
      background-color: #eee7d7;
    }
    .font-settings-panel {
      display: none;
      background-color: #eee9dc;
      padding: 10px 18px;
      border-bottom: 1px solid #d5cec0;
      justify-content: space-around;
      align-items: center;
    }
    .font-settings-panel.active { display: flex; }
    .font-btn {
      padding: 5px 15px;
      border: 1px solid #ccc;
      background: white;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="toc-overlay" id="tocOverlay" onclick="toggleTOC()"></div>

  <div class="toc-drawer" id="tocDrawer">
    <div class="drawer-novel-title" id="drawerNovelName">剑来 (ដាវឈិនភីងអាន)</div>
    <input type="text" id="searchInput" class="toc-search-box" placeholder="ស្វែងរកជំពូក..." onkeyup="filterChapters()">
    <ul class="toc-items-container" id="tocContainer"></ul>
  </div>

  <div class="app-container">
    <header class="top-header">
      <a href="../" class="header-btn" title="ត្រឡប់ទៅទំព័រដើម">‹</a>
      <div class="header-title" id="topHeaderTitle">កំពុងផ្ទុក...</div>
      <button class="header-btn" onclick="toggleTOC()">☰</button>
    </header>

    <div class="action-icons-bar">
      <button class="icon-action-btn" title="បញ្ជីមាតិកា" onclick="toggleTOC()">📖</button>
      <button class="icon-action-btn" title="ប្តូរទំហំអក្សរ" onclick="toggleFontPanel()">⚙️</button>
    </div>

    <div class="font-settings-panel" id="fontPanel">
      <span>ទំហំអក្សរ៖</span>
      <button class="font-btn" onclick="adjustFont(-1)">A -</button>
      <button class="font-btn" onclick="adjustFont(1)">A +</button>
    </div>

    <main class="content-canvas">
      <div class="volume-header" id="displayVolume"></div>
      <div class="chapter-main-title" id="displayTitle"></div>
      <div class="novel-text" id="displayContent"></div>
    </main>

    <div class="bottom-pagination">
      <button class="page-btn" onclick="navigateChapter(-1)">‹ ជំពូកមុន</button>
      <button class="page-btn" onclick="toggleTOC()">មាតិកា</button>
      <button class="page-btn" onclick="navigateChapter(1)">ជំពូកបន្ទាប់ ›</button>
    </div>
  </div>

  <script>
    let chaptersData = [];
    let currentChapterIndex = 0;
    let currentFontSize = 18;

    async function loadDynamicChapters() {
      try {
        const res = await fetch('https://neakan-backend.onrender.com/api/chapters/jianlai');
        const result = await res.json();
        if (result.status === 'SUCCESS' && result.data && result.data.length > 0) {
          chaptersData = result.data;
          renderSidebarTOC();
          loadChapter(0);
        } else {
          document.getElementById('topHeaderTitle').innerText = 'មិនទាន់មានជំពូក';
          document.getElementById('displayTitle').innerText = 'មិនទាន់មានជំពូកនៅឡើយទេ';
          document.getElementById('displayContent').innerHTML = '<p style="text-align:center;">សូមរង់ចាំការ Update ជំពូកថ្មីៗ...</p>';
        }
      } catch (err) {
        console.error('Failed to load chapters:', err);
        document.getElementById('topHeaderTitle').innerText = 'បរាជ័យ';
        document.getElementById('displayTitle').innerText = 'មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ';
      }
    }

    function renderSidebarTOC() {
      const container = document.getElementById('tocContainer');
      container.innerHTML = '';
      if (!chaptersData || chaptersData.length === 0) return;

      chaptersData.forEach((chap, idx) => {
        const li = document.createElement('li');
        li.innerText = chap.title || chap.ep;
        li.id = 'toc-item-' + idx;
        li.onclick = () => {
          loadChapter(idx);
          toggleTOC();
        };
        container.appendChild(li);
      });
    }

    function loadChapter(index) {
      if (!chaptersData || index < 0 || index >= chaptersData.length) return;
      currentChapterIndex = index;
      const chapter = chaptersData[index];

      document.getElementById('topHeaderTitle').innerText = chapter.title || chapter.ep;
      document.getElementById('displayVolume').innerText = chapter.ep || '';
      document.getElementById('displayTitle').innerText = chapter.title || '';

      const rawText = chapter.url || chapter.content || 'មិនមានអត្ថបទឡើយ';
      const formattedHtml = rawText
        .split('\n\n')
        .filter(p => p.trim() !== '')
        .map(p => `<p style="font-size: ${currentFontSize}px;">${p.trim()}</p>`)
        .join('');

      document.getElementById('displayContent').innerHTML = formattedHtml;

      document.querySelectorAll('#tocContainer li').forEach(li => li.classList.remove('active'));
      const activeLi = document.getElementById('toc-item-' + index);
      if (activeLi) {
        activeLi.classList.add('active');
        activeLi.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      window.scrollTo(0, 0);
    }

    function navigateChapter(direction) {
      loadChapter(currentChapterIndex + direction);
    }

    function toggleTOC() {
      document.getElementById('tocDrawer').classList.toggle('open');
      document.getElementById('tocOverlay').classList.toggle('active');
    }

    function toggleFontPanel() {
      document.getElementById('fontPanel').classList.toggle('active');
    }

    function filterChapters() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      chaptersData.forEach((chap, idx) => {
        const el = document.getElementById('toc-item-' + idx);
        const titleText = (chap.title || chap.ep || '').toLowerCase();
        if (el) el.style.display = titleText.includes(keyword) ? '' : 'none';
      });
    }

    function adjustFont(step) {
      currentFontSize += step;
      if (currentFontSize < 14) currentFontSize = 14;
      if (currentFontSize > 28) currentFontSize = 28;
      document.querySelectorAll('#displayContent p').forEach(p => {
        p.style.fontSize = currentFontSize + 'px';
      });
    }

    window.onload = loadDynamicChapters;
  </script>
</body>
</html>
