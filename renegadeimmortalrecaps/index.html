    function formatVideoEmbedUrl(rawUrl) {
      if (!rawUrl || rawUrl.trim() === '') return '';
      let url = rawUrl.trim();

      if (url.includes('youtube.com/watch?v=')) {
        const videoId = url.split('watch?v=')[1].split('&')[0];
        return `https://www.youtube.com/embed/${videoId}`;
      }
      if (url.includes('youtu.be/')) {
        const videoId = url.split('youtu.be/')[1].split('?')[0];
        return `https://www.youtube.com/embed/${videoId}`;
      }
      if (url.includes('youtube.com/live/')) {
        const videoId = url.split('youtube.com/live/')[1].split('?')[0];
        return `https://www.youtube.com/embed/${videoId}`;
      }
      return url;
    }

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';

      episodesData.forEach((item, index) => {
        const btn = document.createElement('div');
        btn.className = `ep-card ${index === currentSelectedEp ? 'active' : ''}`;
        btn.innerText = item.ep;
        btn.onclick = () => selectEpisode(index);
        container.appendChild(btn);
      });
    }

    function selectEpisode(index) {
      currentSelectedEp = index;
      const target = episodesData[index];

      document.getElementById('currentEpTitle').innerText = target.title;
      renderPlaylist();

      const iframe = document.getElementById('activeVideoFrame');
      const placeholder = document.getElementById('placeholderView');

      const formattedUrl = formatVideoEmbedUrl(target.url);

      if (formattedUrl !== '') {
        iframe.src = formattedUrl;
        iframe.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        iframe.src = '';
        iframe.style.display = 'none';
        placeholder.style.display = 'flex';
        document.getElementById('placeholderText').innerText = `⏳ ${target.ep} នឹងមកដល់ឆាប់ៗ`;
      }
    }

    document.addEventListener('contextmenu', e => e.preventDefault(), true);
    window.onload = () => {
