<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>សម្រាយរឿង ស៊ាននី (仙逆) - Neakan</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    *, *::before, *::after {
      -webkit-user-select: none !important;
      user-select: none !important;
    }

    body {
      background-color: #121212;
      font-family: 'Battambang', sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-nav {
      width: 100%;
      height: 50px;
      background-color: #1a1a1a;
      border-bottom: 1.5px solid #28a745;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .back-btn {
      color: #28a745;
      text-decoration: none;
      font-size: 24px;
      font-weight: bold;
    }
    .nav-title {
      color: #28a745;
      font-weight: 700;
      font-size: 15px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      padding: 20px 16px 50px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* កន្លែងចាក់ Video ឬបង្ហាញ Placeholder Thumbnail */
    .player-container {
      width: 100%;
      aspect-ratio: 16/9;
      background-color: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #333;
      position: relative;
    }
    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: none; /* លាក់រហូតដល់មាន Video */
    }

    .thumbnail-placeholder {
      width: 100%;
      height: 100%;
      position: relative;
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .thumbnail-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
      position: absolute;
      top: 0; left: 0;
    }
    .placeholder-badge {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #28a745;
      padding: 8px 18px;
      border-radius: 50px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
    }

    .video-details {
      background-color: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #282828;
    }
    .video-details h2 {
      font-size: 17px;
      color: #fff;
      margin-bottom: 5px;
    }
    .video-details p {
      font-size: 13px;
      color: #888;
    }

    /* បញ្ជី Playlist ភាគច្រើន */
    .playlist-section {
      background-color: #1a1a1a;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #282828;
    }
    .playlist-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #28a745;
      margin-bottom: 12px;
    }
    .playlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .ep-card {
      background-color: #242424;
      border: 1px solid #383838;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #bbb;
      transition: all 0.2s;
    }
    .ep-card:hover {
      background-color: #2f2f2f;
      border-color: #28a745;
      color: #fff;
    }
    .ep-card.active {
      background-color: #28a745;
      border-color: #28a745;
      color: #fff;
    }
  </style>
</head>
<body>

  <header class="top-nav">
    <a href="../" class="back-btn">‹</a>
    <div class="nav-title">សម្រាយរឿង ស៊ាននី (仙逆)</div>
    <div style="width: 24px;"></div>
  </header>

  <main class="container">

    <div class="player-container">
      <!-- Placeholder Thumbnail ពេលមិនទាន់ដាក់ Video -->
      <div class="thumbnail-placeholder" id="placeholderView">
        <img src="../xianni/Cover.jpg" alt="Poster Thumbnail" onerror="this.src='https://upload.wikimedia.org/wikipedia/zh/thumb/4/41/Renegade_Immortal_poster.jpg/440px-Renegade_Immortal_poster.jpg'">
        <div class="placeholder-badge" id="placeholderText">⏳ វីដេអូភាគនេះនឹងមកដល់ឆាប់ៗ</div>
      </div>

      <!-- Video Player -->
      <iframe id="activeVideoFrame" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="video-details">
      <h2 id="currentEpTitle">ភាគ ០១-២០ (វគ្គទី ១)</h2>
      <p>សម្រាយសាច់រឿងលម្អិតប្រលោមលោក 仙逆 (Renegade Immortal)</p>
    </div>

    <!-- បញ្ជី Playlist ភាគច្រើន -->
    <div class="playlist-section">
      <div class="playlist-title">🎞️ បញ្ជីភាគទាំងអស់ (Playlist)</div>
      <div class="playlist-grid" id="playlistContainer"></div>
    </div>

  </main>

  <script>
    // បញ្ជីទិន្នន័យ Playlist (បើមិនទាន់មានវីដេអូ ទុក url: '' នោះប្រព័ន្ធនឹងបង្ហាញតែ Thumbnail)
    const episodesData = [
      {
        ep: 'ភាគ ០១-២០',
        title: 'ភាគ ០១-២០៖ ដំណើរចូលនិកាយហេងយៀក',
        url: '' // ដាក់ Link Embed នៅពេលមានវីដេអូ
      },
      {
        ep: 'ភាគ ២១-៤០',
        title: 'ភាគ ២១-៤០៖ ការសងសឹកនៅដែនដីចូវ',
        url: '' // ទុកទំនេរ ប្រព័ន្ធនឹងបង្ហាញ Thumbnail Placeholder
      },
      {
        ep: 'ភាគ ៤១-៦០',
        title: 'ភាគ ៤១-៦០៖ វិបត្តិនៅសមុទ្រអារក្ស',
        url: ''
      }
    ];

    let currentSelectedEp = 0;

    function renderPlaylist() {
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';

      episodesData.forEach((item, index) => {
        const btn = document.createElement('div');
        btn.className = `ep-card ${index === currentSelectedEp ? 'active' : ''}`;
        btn.innerText = item.ep;
        btn.onclick = () => selectEpisode(index);
        container.appendChild(btn);
      });
    }

    function selectEpisode(index) {
      currentSelectedEp = index;
      const target = episodesData[index];

      document.getElementById('currentEpTitle').innerText = target.title;
      renderPlaylist();

      const iframe = document.getElementById('activeVideoFrame');
      const placeholder = document.getElementById('placeholderView');

      if (target.url && target.url.trim() !== '') {
        iframe.src = target.url;
        iframe.style.display = 'block';
        placeholder.style.display = 'none';
      } else {
        iframe.src = '';
        iframe.style.display = 'none';
        placeholder.style.display = 'flex';
        document.getElementById('placeholderText').innerText = `⏳ ${target.ep} នឹងមកដល់ឆាប់ៗ`;
      }
    }

    document.addEventListener('contextmenu', e => e.preventDefault(), true);
    window.onload = () => {
      renderPlaylist();
      selectEpisode(0);
    };
  </script>

</body>
</html>
