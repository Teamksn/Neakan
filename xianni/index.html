<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>អានប្រលោមលោក</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f7f4ed;
      font-family: 'Battambang', sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 800px;
      min-height: 100vh;
      background-color: #f7f4ed;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-header {
      position: sticky;
      top: 0; left: 0; width: 100%; height: 50px;
      background-color: #f7f4ed;
      border-bottom: 1.5px solid #28a745;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 100;
    }
    .header-btn {
      background: none; border: none; font-size: 22px; color: #28a745;
      cursor: pointer; font-weight: bold; display: flex; align-items: center;
      justify-content: center; width: 35px; height: 35px; text-decoration: none;
    }
    .header-title {
      font-size: 15px; color: #28a745; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%;
    }
    .content-canvas { flex: 1; padding: 20px 18px 40px 18px; }
    .volume-header { font-size: 18px; font-weight: 900; color: #111; text-align: center; margin-bottom: 5px; }
    .chapter-main-title { font-size: 17px; font-weight: 700; color: #28a745; text-align: center; margin-bottom: 25px; }
    .novel-text p { font-size: 18px; line-height: 2.1; color: #1a1a1a; margin-bottom: 20px; text-align: justify; }

    /* ផ្ទាំងចាក់សោរ Paywall KHQR */
    .vip-lock-card {
      background: #ffffff;
      border: 2px dashed #28a745;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      margin: 20px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    .vip-lock-title { font-size: 18px; font-weight: bold; color: #d9534f; margin-bottom: 10px; }
    .vip-lock-desc { font-size: 14px; color: #555; margin-bottom: 20px; }
    .khqr-img { width: 220px; height: 220px; object-fit: contain; margin: 0 auto 15px auto; display: block; border-radius: 8px; border: 1px solid #eee; }
    .passcode-input { padding: 10px 15px; border: 1.5px solid #28a745; border-radius: 6px; font-family: 'Battambang'; outline: none; width: 200px; text-align: center; margin-bottom: 10px; font-size: 15px; }
    .unlock-btn { padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-family: 'Battambang'; font-weight: bold; cursor: pointer; }

    .bottom-pagination {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 20px 18px 60px 18px; border-top: 1px solid #e2ddd2;
    }
    .page-btn {
      flex: 1; padding: 10px; border: 1px solid #d5cec0; background-color: #eee9dc;
      border-radius: 4px; font-family: 'Battambang'; font-size: 14px; font-weight: bold; color: #333; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="top-header">
      <a href="../" class="header-btn" title="ទំព័រដើម">‹</a>
      <div class="header-title" id="topHeaderTitle">កំពុងដំណើរការ...</div>
      <div></div>
    </header>

    <main class="content-canvas">
      <div class="volume-header" id="displayVolume"></div>
      <div class="chapter-main-title" id="displayTitle"></div>
      <div class="novel-text" id="displayContent"></div>
    </main>

    <div class="bottom-pagination">
      <button class="page-btn" onclick="navigateChapter(-1)">‹ ជំពូកមុន</button>
      <button class="page-btn" onclick="navigateChapter(1)">ជំពូកបន្ទាប់ ›</button>
    </div>
  </div>

  <script src="chapters.js?v=11.0"></script>
  <script>
    let currentChapterIndex = 0;
    const VIP_PASSCODE = "1234"; // លេខសម្ងាត់សម្រាប់ដោះសោរជំពូក VIP

    function initWebsite() {
      if (typeof window.chaptersData !== 'undefined' && window.chaptersData.length > 0) {
        loadChapter(0);
      }
    }

    function loadChapter(index) {
      if (typeof window.chaptersData === 'undefined' || index < 0 || index >= window.chaptersData.length) return;
      currentChapterIndex = index;
      const chapter = window.chaptersData[index];

      document.getElementById('topHeaderTitle').innerText = chapter.title;
      document.getElementById('displayVolume').innerText = chapter.volume || '';
      document.getElementById('displayTitle').innerText = chapter.title;

      const isUnlocked = localStorage.getItem('vip_unlocked_' + chapter.id);

      // ប្រសិនបើជាជំពូក VIP ហើយមិនទាន់ដោះសោរ
      if (chapter.isVip && !isUnlocked) {
        document.getElementById('displayContent').innerHTML = `
          <div class="vip-lock-card">
            <div class="vip-lock-title">🔒 ជំពូកនេះសម្រាប់តែសមាជិក VIP ប៉ុណ្ណោះ</div>
            <div class="vip-lock-desc">សូមស្កេន KHQR ខាងក្រោមដើម្បីគាំទ្រ និងទទួលបានលេខកូដសម្ងាត់ដោះសោរអាន៖</div>
            <img src="khqr.jpg" alt="Bakong KHQR" class="khqr-img" onerror="this.src='https://via.placeholder.com/220?text=KHQR+Image'">
            <br>
            <input type="password" id="passInput" class="passcode-input" placeholder="បញ្ចូលលេខសម្ងាត់ដោះសោរ...">
            <br>
            <button class="unlock-btn" onclick="verifyPasscode(${chapter.id})">ដោះសោរអានភ្លាមៗ</button>
          </div>
        `;
      } else {
        const formattedHtml = chapter.content
          .split('\n\n')
          .filter(p => p.trim() !== '')
          .map(p => `<p>${p.trim()}</p>`)
          .join('');
        document.getElementById('displayContent').innerHTML = formattedHtml;
      }
      window.scrollTo(0, 0);
    }

    function verifyPasscode(chapId) {
      const enteredPass = document.getElementById('passInput').value;
      if (enteredPass === VIP_PASSCODE) {
        localStorage.setItem('vip_unlocked_' + chapId, 'true');
        alert('ដោះសោរជោគជ័យ! សូមរីករាយជាមួយការអាន។');
        loadChapter(currentChapterIndex);
      } else {
        alert('លេខសម្ងាត់មិនត្រឹមត្រូវទេ! សូមពិនិត្យម្តងទៀត។');
      }
    }

    function navigateChapter(direction) {
      loadChapter(currentChapterIndex + direction);
    }

    window.onload = initWebsite;
  </script>
</body>
</html>
