<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neakan - អានប្រលោមលោក</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #f7f4ed;
      font-family: 'Battambang', sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 800px;
      min-height: 100vh;
      background-color: #f7f4ed;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-header {
      position: sticky;
      top: 0; left: 0; width: 100%; height: 50px;
      background-color: #f7f4ed;
      border-bottom: 1.5px solid #28a745;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      z-index: 100;
    }
    .header-btn {
      background: none; border: none; font-size: 22px; color: #28a745;
      cursor: pointer; font-weight: bold; display: flex; align-items: center;
      justify-content: center; width: 35px; height: 35px; text-decoration: none;
    }
    .header-title {
      font-size: 15px; color: #28a745; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%;
    }
    .toc-trigger-btn {
      background: #e8f5e9; border: 1px solid #28a745; border-radius: 6px;
      color: #28a745; font-family: 'Battambang'; font-size: 13px; font-weight: bold;
      padding: 5px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    /* របារបញ្ជាជំពូកខាងលើ និងខាងក្រោម */
    .chapter-nav-bar {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 12px 18px;
    }
    .chapter-nav-bar.top-bar {
      border-bottom: 1px solid #e2ddd2;
      background-color: #faf7f0;
    }
    .chapter-nav-bar.bottom-bar {
      border-top: 1px solid #e2ddd2;
      padding-bottom: 60px;
    }
    .page-btn {
      flex: 1; padding: 9px 12px; border: 1px solid #d5cec0; background-color: #eee9dc;
      border-radius: 6px; font-family: 'Battambang'; font-size: 13.5px; font-weight: bold;
      color: #333; cursor: pointer; transition: background 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      background-color: #e0d8c7;
    }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .content-canvas { flex: 1; padding: 20px 18px 30px 18px; }
    .volume-header { font-size: 18px; font-weight: 900; color: #111; text-align: center; margin-bottom: 5px; }
    .chapter-main-title { font-size: 17px; font-weight: 700; color: #28a745; text-align: center; margin-bottom: 25px; }
    .novel-text p { font-size: 18px; line-height: 2.1; color: #1a1a1a; margin-bottom: 20px; text-align: justify; }

    /* ផ្ទាំង Paywall KHQR ធំ និងស្រស់ស្អាត */
    .vip-lock-card {
      background: #ffffff;
      border: 1.5px solid #d4edda;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      margin: 25px auto;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(40, 167, 69, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
    }
    .vip-lock-badge {
      display: inline-block;
      background-color: #fff3cd;
      color: #856404;
      font-weight: 900;
      font-size: 16px;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 14px;
      border: 1px solid #ffeeba;
    }
    .vip-lock-steps {
      background-color: #fbfbf8;
      border: 1px solid #eee8db;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #444;
      line-height: 1.7;
      text-align: left;
      margin: 0 auto 20px auto;
      max-width: 440px;
    }
    .vip-lock-steps b { color: #111; }

    .khqr-frame {
      background: #ffffff;
      border: 2px solid #28a745;
      border-radius: 14px;
      padding: 12px;
      display: inline-block;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      margin-bottom: 20px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .khqr-frame:hover { transform: scale(1.02); }
    .khqr-img {
      width: 280px; height: 370px; object-fit: contain; display: block; border-radius: 8px;
    }
    @media (max-width: 480px) {
      .khqr-img { width: 240px; height: 320px; }
      .vip-lock-card { padding: 22px 14px; }
    }

    .input-action-group {
      display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 360px; margin: 0 auto;
    }
    .passcode-input {
      width: 100%; padding: 12px 16px; border: 2px solid #28a745; border-radius: 10px;
      font-family: 'Battambang', sans-serif; font-size: 16px; font-weight: 700; text-align: center;
      outline: none; background: #faf9f5;
    }
    .unlock-btn {
      width: 100%; padding: 13px 20px; background-color: #28a745; color: white; border: none;
      border-radius: 10px; font-family: 'Battambang', sans-serif; font-size: 16px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }
    .error-msg { font-size: 14px; margin-top: 14px; font-weight: 700; line-height: 1.5; }

    /* ផ្ទាំងរុញមាតិកា (Table of Contents Modal) */
    .toc-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 200; display: none;
      justify-content: center; align-items: flex-end;
    }
    .toc-modal-container {
      background: #f7f4ed; width: 100%; max-width: 800px; max-height: 75vh;
      border-radius: 16px 16px 0 0; display: flex; flex-direction: column;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15); animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .toc-modal-header {
      padding: 16px 20px; border-bottom: 1px solid #e2ddd2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .toc-modal-header h3 { font-size: 17px; font-weight: 900; color: #28a745; }
    .toc-close-btn { background: none; border: none; font-size: 24px; color: #888; cursor: pointer; }
    .toc-list-body {
      flex: 1; overflow-y: auto; padding: 10px 15px 30px 15px; display: flex; flex-direction: column; gap: 8px;
    }
    .toc-item-btn {
      display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;
      background: #ffffff; border: 1px solid #e2ddd2; border-radius: 8px; font-family: 'Battambang';
      font-size: 14.5px; text-align: left; cursor: pointer; color: #222; transition: all 0.2s;
    }
    .toc-item-btn.active {
      border-color: #28a745; background-color: #e8f5e9; font-weight: bold; color: #28a745;
    }
    .toc-lock-icon { font-size: 14px; color: #d9534f; }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="top-header">
      <a href="../" class="header-btn" title="ទំព័រដើម">‹</a>
      <div class="header-title" id="topHeaderTitle">កំពុងដំណើរការ...</div>
      <button class="toc-trigger-btn" onclick="openTocModal()">☰ មាតិកា</button>
    </header>

    <!-- របារជំពូកផ្នែកខាងលើ -->
    <div class="chapter-nav-bar top-bar">
      <button class="page-btn" id="prevBtnTop" onclick="navigateChapter(-1)">‹ ជំពូកមុន</button>
      <button class="page-btn" id="nextBtnTop" onclick="navigateChapter(1)">ជំពូកបន្ទាប់ ›</button>
    </div>

    <main class="content-canvas">
      <div class="volume-header" id="displayVolume"></div>
      <div class="chapter-main-title" id="displayTitle"></div>
      <div class="novel-text" id="displayContent"></div>
    </main>

    <!-- របារជំពូកផ្នែកខាងក្រោម -->
    <div class="chapter-nav-bar bottom-bar">
      <button class="page-btn" id="prevBtnBottom" onclick="navigateChapter(-1)">‹ ជំពូកមុន</button>
      <button class="page-btn" id="nextBtnBottom" onclick="navigateChapter(1)">ជំពូកបន្ទាប់ ›</button>
    </div>
  </div>

  <!-- ផ្ទាំងតារាងមាតិកា Drawer Modal -->
  <div class="toc-modal-overlay" id="tocOverlay" onclick="closeTocModal(event)">
    <div class="toc-modal-container" onclick="event.stopPropagation()">
      <div class="toc-modal-header">
        <h3>📖 មាតិកាជំពូកទាំងអស់</h3>
        <button class="toc-close-btn" onclick="closeTocModal()">×</button>
      </div>
      <div class="toc-list-body" id="tocListBody"></div>
    </div>
  </div>

  <script src="chapters.js?v=2026.8"></script>
  <script>
    // បិទភ្ជាប់ URL Cloudflare Tunnel របស់អ្នកនៅត្រង់នេះ
    const BACKEND_API_URL = 'https://random-words-abc.trycloudflare.com';

    let currentChapterIndex = 0;

    function getOrCreateDeviceId() {
      let deviceId = localStorage.getItem('user_device_id');
      if (!deviceId) {
        deviceId = 'DEV-' + Math.random().toString(36).substring(2, 10) + Date.now();
        localStorage.setItem('user_device_id', deviceId);
      }
      return deviceId;
    }

    function initWebsite() {
      if (!window.chaptersData || window.chaptersData.length === 0) {
        document.getElementById('displayContent').innerText = "មិនមានទិន្នន័យជំពូកឡើយ។";
        return;
      }

      renderTocList();

      const urlParams = new URLSearchParams(window.location.search);
      const chapQuery = urlParams.get('chap') || window.location.hash.replace('#', '');
      
      let targetIndex = 0;
      if (chapQuery) {
        const foundIndex = window.chaptersData.findIndex(c => String(c.id) === String(chapQuery));
        if (foundIndex !== -1) {
          targetIndex = foundIndex;
        }
      }

      loadChapter(targetIndex, false);
    }

    function renderTocList() {
      const tocContainer = document.getElementById('tocListBody');
      tocContainer.innerHTML = '';

      window.chaptersData.forEach((chap, idx) => {
        const btn = document.createElement('button');
        btn.className = `toc-item-btn ${idx === currentChapterIndex ? 'active' : ''}`;
        
        const lockHtml = chap.isVip ? '<span class="toc-lock-icon">🔒 VIP</span>' : '';
        btn.innerHTML = `<span>${chap.title || ('ជំពូក ' + (idx + 1))}</span> ${lockHtml}`;
        
        btn.onclick = () => {
          loadChapter(idx, true);
          closeTocModal();
        };
        tocContainer.appendChild(btn);
      });
    }

    function openTocModal() {
      renderTocList();
      document.getElementById('tocOverlay').style.display = 'flex';
    }

    function closeTocModal() {
      document.getElementById('tocOverlay').style.display = 'none';
    }

    function loadChapter(index, updateUrl = true) {
      if (!window.chaptersData || index < 0 || index >= window.chaptersData.length) return;
      currentChapterIndex = index;
      const chapter = window.chaptersData[index];

      if (updateUrl && chapter.id) {
        const newUrl = `${window.location.pathname}?chap=${chapter.id}`;
        window.history.pushState({ path: newUrl }, '', newUrl);
      }

      document.getElementById('topHeaderTitle').innerText = chapter.title || '';
      document.getElementById('displayVolume').innerText = chapter.volume || '';
      document.getElementById('displayTitle').innerText = chapter.title || '';

      const isFirst = (currentChapterIndex === 0);
      const isLast = (currentChapterIndex === window.chaptersData.length - 1);

      document.getElementById('prevBtnTop').disabled = isFirst;
      document.getElementById('nextBtnTop').disabled = isLast;
      document.getElementById('prevBtnBottom').disabled = isFirst;
      document.getElementById('nextBtnBottom').disabled = isLast;

      const chapId = chapter.id || (index + 1);
      const isUnlocked = sessionStorage.getItem('vip_unlocked_' + chapId);
      const isChapterVip = (chapter.isVip === true);

      if (isChapterVip && !isUnlocked) {
        document.getElementById('displayContent').innerHTML = `
          <div class="vip-lock-card">
            <div class="vip-lock-badge">🔒 ជំពូក VIP (តម្លៃ $0.10)</div>
            
            <div class="vip-lock-steps">
              <b>ជំហានទី ១៖</b> ស្កេន KHQR ខាងក្រោមដើម្បីបង់ប្រាក់ $0.10<br>
              <b>ជំហានទី ២៖</b> ផ្ញើរូបវិក្កយបត្រទៅកាន់ Bot <a href="https://t.me/Teamksn_bot" target="_blank" style="color:#28a745; font-weight:900; text-decoration: underline;">@Teamksn AC</a><br>
              <b>ជំហានទី ៣៖</b> យកលេខ <b>APV (៦ ខ្ទង់)</b> មកបំពេញខាងក្រោម
            </div>

            <div class="khqr-frame" title="ចុចដើម្បីមើលរូបភាពធំ" onclick="window.open('khqr.jpg', '_blank')">
              <img src="khqr.jpg" alt="Bakong KHQR" class="khqr-img" onerror="this.onerror=null; this.src='khqr.png';">
            </div>

            <div class="input-action-group">
              <input type="text" id="apvInput" class="passcode-input" placeholder="បញ្ចូលលេខ APV (ឧ. 484595)">
              <button class="unlock-btn" onclick="verifyApvCode(${chapId})">ដោះសោរអានភ្លាមៗ</button>
            </div>
            
            <div id="errorAlert" class="error-msg" style="display: none;"></div>
          </div>
        `;
      } else {
        const rawContent = chapter.content || '';
        const formattedHtml = rawContent
          .split('\n\n')
          .filter(p => p.trim() !== '')
          .map(p => `<p>${p.trim()}</p>`)
          .join('');
        document.getElementById('displayContent').innerHTML = formattedHtml || '<p>មិនមានខ្លឹមសារអត្ថបទឡើយ។</p>';
      }
      window.scrollTo(0, 0);
    }

    async function verifyApvCode(chapId) {
      const inputEl = document.getElementById('apvInput');
      const errorEl = document.getElementById('errorAlert');
      if (!inputEl) return;
      
      const enteredCode = inputEl.value.trim();
      if (!enteredCode) {
        errorEl.style.display = 'block';
        errorEl.style.color = '#d9534f';
        errorEl.innerText = 'សូមបញ្ចូលលេខ APV ជាមុនសិន!';
        return;
      }

      const currentDeviceId = getOrCreateDeviceId();

      errorEl.style.display = 'block';
      errorEl.style.color = '#e67e22';
      errorEl.innerText = '⏳ កំពុងផ្ទៀងផ្ទាត់ជាមួយ Server...';

      try {
        const res = await fetch(`${BACKEND_API_URL}/api/verify-payment`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            code: enteredCode,
            deviceId: currentDeviceId
          })
        });
        const data = await res.json();

        if (data.status === 'SUCCESS') {
          sessionStorage.setItem('vip_unlocked_' + chapId, 'true');
          errorEl.style.color = '#28a745';
          errorEl.innerText = '🎉 ' + data.message;
          setTimeout(() => {
            loadChapter(currentChapterIndex, false);
          }, 800);
        } else {
          errorEl.style.color = '#d9534f';
          errorEl.innerText = '❌ ' + data.message;
        }
      } catch (err) {
        errorEl.style.color = '#d9534f';
        errorEl.innerText = '⚠️ មិនអាចភ្ជាប់ទៅកាន់ Server បានទេ!';
      }
    }

    function navigateChapter(direction) {
      const newIndex = currentChapterIndex + direction;
      if (newIndex >= 0 && newIndex < window.chaptersData.length) {
        loadChapter(newIndex, true);
      }
    }

    window.onpopstate = function() {
      initWebsite();
    };

    window.onload = initWebsite;
  </script>
</body>
</html>
