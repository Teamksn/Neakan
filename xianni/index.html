<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neakan - បណ្ណាល័យប្រលោមលោក</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #f7f4ed;
      font-family: 'Battambang', sans-serif;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .site-header {
      width: 100%;
      background-color: #f7f4ed;
      border-bottom: 2px solid #28a745;
      padding: 15px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .site-header h1 {
      font-size: 22px;
      color: #28a745;
      font-weight: 900;
    }
    .site-header p {
      font-size: 13px;
      color: #666;
      margin-top: 2px;
    }

    .library-container {
      width: 100%;
      max-width: 800px;
      padding: 20px 16px 50px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .novel-card {
      background-color: #ffffff;
      border: 1px solid #e5dfd3;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s;
    }
    .novel-card:hover {
      transform: translateY(-4px);
      border-color: #28a745;
    }

    .card-cover {
      width: 100%;
      height: 220px;
      background-color: #eee9dc;
      overflow: hidden;
    }
    .card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 5px;
    }
    .card-author {
      font-size: 12.5px;
      color: #777;
      margin-bottom: 8px;
    }
    .card-desc {
      font-size: 13px;
      color: #444;
      line-height: 1.5;
      margin-bottom: 15px;
      flex: 1;
    }

    .card-btn {
      width: 100%;
      padding: 9px 0;
      background-color: #28a745;
      color: white;
      text-align: center;
      border-radius: 4px;
      font-size: 13.5px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>NEAKAN (អ្នកអាន)</h1>
    <p>បណ្តុំប្រលោមលោក និងការបកប្រែ</p>
  </header>

  <main class="library-container">

    <!-- កាតរឿងទី ១៖ ស៊ាននី -->
    <a href="xianni/" class="novel-card">
      <div class="card-cover">
        <img src="Cover.jpg" alt="Poster" onerror="this.src='https://upload.wikimedia.org/wikipedia/zh/thumb/4/41/Renegade_Immortal_poster.jpg/440px-Renegade_Immortal_poster.jpg'">
      </div>
      <div class="card-info">
        <div class="card-title">仙逆 (ស៊ាននី - Renegade Immortal)</div>
        <div class="card-author">អ្នកនិពន្ធ: អឺកើន (耳根)</div>
        <div class="card-desc">ដំណើរផ្សងព្រេងរបស់យុវជន វ៉ាងលីន ក្នុងការដើរលើផ្លូវបដិបត្តិធម៌ប្រឆាំងនឹងវាសនា។</div>
        <div class="card-btn">ចូលអាន →</div>
      </div>
    </a>

  </main>

</body>
</html>
